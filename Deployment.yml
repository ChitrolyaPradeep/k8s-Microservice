apiVersion: apps/v1
kind: Deployment
metadata:
name: hello-service
labels:
app: hello-service
spec:
replicas: 3
selector:
matchLabels:
app: hello-service
template:
metadata:
labels:
app: hello-service
spec:
containers:
- name: hello-service
image: <dockerhub-username>/hello-service:1.0
ports:
- containerPort: 3000
resources:
requests: { cpu: "100m", memory: "64Mi" }
limits: { cpu: "250m", memory: "128Mi" }
readinessProbe:
httpGet: { path: /health, port: 3000 }
initialDelaySeconds: 3
livenessProbe:
httpGet: { path: /health, port: 3000 }
initialDelaySeconds: 10
